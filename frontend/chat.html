<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>年报问答</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --panel: #ffffff;
      --text: #1f2d3d;
      --muted: #7a869a;
      --brand: #1aa7ff;
      --brand2: #5b7cfa;
      --bubble-user: #1aa7ff;
      --bubble-bot: #ffffff;
      --border: #e6e9ef;
      --shadow: 0 10px 30px rgba(31,45,61,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(26,167,255,.18), transparent 60%),
                  radial-gradient(1000px 500px at 90% 10%, rgba(91,124,250,.18), transparent 55%),
                  var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .app {
      width: 100%;
      max-width: 980px;
      height: min(820px, 92vh);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(26,167,255,.10), rgba(91,124,250,.10));
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 240px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 8px 18px rgba(26,167,255,.25);
    }
    .title { display: flex; flex-direction: column; line-height: 1.1; }
    .title strong { font-size: 14px; }
    .title span { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .top-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .pill {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff;
    }
    .btn {
      border: none;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn.ghost {
      background: #fff;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .chat {
      flex: 1;
      overflow: auto;
      padding: 16px 14px 10px;
      background: linear-gradient(180deg, rgba(26,167,255,.05), transparent 40%),
                 linear-gradient(0deg, rgba(91,124,250,.05), transparent 45%);
    }
    .dayline { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 14px; }
    .msg { display: flex; gap: 10px; margin: 10px 0; align-items: flex-end; }
    .msg.user { justify-content: flex-end; }
    .avatar {
      width: 34px; height: 34px; border-radius: 10px;
      background: #e9eef7;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #3b4a5a; flex: 0 0 auto;
    }
    .avatar.bot { background: linear-gradient(135deg, rgba(26,167,255,.18), rgba(91,124,250,.18)); }
    .bubble {
      max-width: min(720px, 76%);
      border-radius: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--bubble-bot);
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--bubble-user); color: #fff; border-color: transparent; }
    .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .msg.user .meta { color: rgba(255,255,255,.85); }

    details.progress {
      margin-top: 8px;
      border: 1px dashed rgba(122,134,154,.45);
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(122,134,154,.06);
    }
    details.progress summary { cursor: pointer; user-select: none; color: var(--muted); font-size: 12px; }
    .progress ul { margin: 8px 0 0 18px; padding: 0; }
    .progress li { margin: 4px 0; font-size: 12px; color: #56657a; }

    .citations {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cite-chip {
      font-size: 11px;
      border: 1px solid var(--border);
      background: rgba(26,167,255,.08);
      color: #2c5282;
      border-radius: 999px;
      padding: 3px 9px;
      cursor: pointer;
    }
    .cite-chip:hover { background: rgba(26,167,255,.16); }
    .cite-detail {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      border-left: 3px solid rgba(26,167,255,.4);
      padding: 4px 8px;
      display: none;
      white-space: pre-wrap;
    }
    .cite-detail.show { display: block; }

    .typing { display: inline-flex; gap: 6px; align-items: center; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #9aa6b2;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .6; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      font-family: inherit;
    }
    textarea:focus { border-color: rgba(26,167,255,.6); box-shadow: 0 0 0 3px rgba(26,167,255,.12); }
    .send {
      width: 88px;
      height: 44px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .send:disabled { opacity: .6; cursor: not-allowed; }
    .hint {
      padding: 0 14px 12px;
      color: var(--muted);
      font-size: 12px;
      background: #fff;
    }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 6px;
      background: #f7f9fc;
      color: #3b4a5a;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>年报问答</strong>
          <span id="subTitle">在线 · 支持指标 / 对比 / 趋势 / 事实问答</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="sessionPill">会话: —</span>
        <a class="btn ghost" href="index.html">首页</a>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">AR</div>
        <div>
          <div class="bubble">你好，我是上市公司年报问答助手。可以问我：

• 贵州茅台 2024 年毛利率是多少？
• 对比茅台和五粮液 2023 年 ROE
• 宁德时代近三年营收趋势

回答会标注证据引用，点引用编号可展开原文片段。</div>
          <div class="meta">提示：回答基于已导入的年报数据</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

<script>
  const API_BASE = location.protocol.startsWith('http')
    ? `${location.protocol}//${location.host}`
    : 'http://127.0.0.1:8003';

  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const btnClear = document.getElementById('btnClear');
  const sessionPill = document.getElementById('sessionPill');

  // session_id：空则服务端生成并在首帧回传（05 §3.1）
  let sessionId = localStorage.getItem('ar_session_id') || '';
  function renderSession() {
    sessionPill.textContent = sessionId ? `会话: ${sessionId.slice(0, 8)}…` : '会话: 新建';
  }
  renderSession();

  function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
  function nowTime() {
    return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function addUserMsg(text) {
    chatEl.insertAdjacentHTML('beforeend', `
      <div class="msg user">
        <div>
          <div class="bubble">${escapeHtml(text)}</div>
          <div class="meta">${nowTime()}</div>
        </div>
        <div class="avatar">我</div>
      </div>
    `);
    scrollToBottom();
  }

  function addBotMsgSkeleton() {
    const id = 'bot-' + Math.random().toString(36).slice(2);
    chatEl.insertAdjacentHTML('beforeend', `
      <div class="msg bot" id="${id}">
        <div class="avatar bot">AR</div>
        <div style="min-width: 200px;">
          <div class="bubble">
            <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
            <details class="progress" open>
              <summary>阶段进度（等待中）</summary>
              <ul></ul>
            </details>
          </div>
          <div class="meta">${nowTime()}</div>
        </div>
      </div>
    `);
    scrollToBottom();
    return document.getElementById(id);
  }

  // ---------- 阶段进度 ----------
  function addProgress(botMsgEl, text) {
    const ul = botMsgEl.querySelector('details.progress ul');
    const summary = botMsgEl.querySelector('details.progress summary');
    const li = document.createElement('li');
    li.textContent = text;
    ul.appendChild(li);
    summary.textContent = `阶段进度（${ul.children.length} 步）`;
    scrollToBottom();
  }

  // ---------- SSE 帧解析（POST 流式，不能用 EventSource） ----------
  // 帧格式：data: {json}\n\n（04 §8）
  async function* readSSE(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        for (const line of frame.split('\n')) {
          if (line.startsWith('data: ')) {
            try { yield JSON.parse(line.slice(6)); } catch { /* 忽略坏帧 */ }
          }
        }
      }
    }
  }

  // ---------- 事件 → UI ----------
  function onEvent(botMsgEl, ev, ctx) {
    switch (ev.type) {
      case 'session':
        // 首帧：服务端生成的 session_id 回传，下一轮带回
        if (ev.session_id) {
          sessionId = ev.session_id;
          localStorage.setItem('ar_session_id', sessionId);
          renderSession();
        }
        addProgress(botMsgEl, `🔗 会话 ${ev.session_id || ''} / 请求 ${ev.request_id || ''}`);
        break;

      case 'intent':
        addProgress(botMsgEl, `🧠 意图: ${ev.intent}（置信度 ${((ev.confidence ?? 0) * 100).toFixed(0)}%）`);
        break;

      case 'entities':
        if (ev.stock_codes?.length) addProgress(botMsgEl, `🏢 股票: ${ev.stock_codes.join(', ')}`);
        if (ev.periods?.length) addProgress(botMsgEl, `📅 期间: ${ev.periods.join(', ')}`);
        if (ev.unresolved_names?.length) addProgress(botMsgEl, `⚠️ 未解析: ${ev.unresolved_names.join(', ')}`);
        break;

      case 'clarify':
        // 可行动提示不是故障（04 §8）；终态
        ctx.terminal = true;
        finishTyping(botMsgEl);
        ctx.answerEl.textContent = ev.message || '需要您补充信息后才能继续。';
        break;

      case 'out_of_scope':
        ctx.terminal = true;
        finishTyping(botMsgEl);
        ctx.answerEl.textContent = ev.message || '该问题不在年报问答范围内。';
        break;

      case 'sub_query':
        if (ev.question) {
          addProgress(botMsgEl, `🔍 子问题 [${ev.sub_id}] ${ev.question}（${ev.status || 'running'}）`);
        } else {
          addProgress(botMsgEl, `✅ 子问题 [${ev.sub_id}] ${ev.status}${ev.hyde_used ? ' · HyDE' : ''}`);
        }
        break;

      case 'evidence':
        ctx.citations.set(ev.ref, ev);
        addProgress(botMsgEl, `📎 证据 [${ev.ref}] ${ev.type || ''} ${ev.stock_code || ''} ${ev.report_period || ''} p.${ev.page_no ?? '—'}`);
        break;

      case 'metric':
        if (Array.isArray(ev.rows)) addProgress(botMsgEl, `📊 指标行 ×${ev.rows.length}`);
        break;

      case 'token':
        if (ev.content) {
          ctx.raw += ev.content;
          ctx.answerEl.textContent = ctx.raw;
          scrollToBottom();
        }
        break;

      case 'citation': {
        const evi = ctx.citations.get(ev.ref);
        renderCitation(botMsgEl, ev, evi);
        break;
      }

      case 'done':
        ctx.terminal = true;
        finishTyping(botMsgEl);
        addProgress(botMsgEl, `✅ 完成（${ev.request_id || ''}）`);
        break;

      case 'error':
        ctx.terminal = true;
        finishTyping(botMsgEl);
        ctx.answerEl.textContent = `抱歉，本次处理失败（${ev.code || 'ERROR'}）：\n${ev.message || ''}`;
        break;

      default:
        // 未知事件类型：挂到进度里，不丢
        addProgress(botMsgEl, `· ${ev.type} ${JSON.stringify(ev).slice(0, 80)}`);
    }
  }

  function finishTyping(botMsgEl) {
    const typing = botMsgEl.querySelector('.typing');
    if (typing) typing.remove();
  }

  function renderCitation(botMsgEl, cite, evidence) {
    const bubble = botMsgEl.querySelector('.bubble');
    let wrap = bubble.querySelector('.citations');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'citations';
      bubble.appendChild(wrap);
    }
    const chip = document.createElement('span');
    chip.className = 'cite-chip';
    const label = evidence
      ? `[${cite.ref}] ${evidence.stock_code || ''} ${evidence.report_period || ''}${evidence.page_no != null ? ' p.' + evidence.page_no : ''}`
      : `[${cite.ref}] p.${cite.page_no ?? '—'}`;
    chip.textContent = label;

    const detail = document.createElement('div');
    detail.className = 'cite-detail';
    detail.textContent = evidence
      ? `【${evidence.type || 'evidence'}】${evidence.snippet || evidence.content || ''}`
      : `document_id: ${cite.document_id || ''}`;

    chip.addEventListener('click', () => detail.classList.toggle('show'));
    wrap.appendChild(chip);
    bubble.appendChild(detail);
    scrollToBottom();
  }

  // ---------- 发送 ----------
  async function onSend() {
    const text = (inputEl.value || '').trim();
    if (!text) return;
    inputEl.value = '';
    addUserMsg(text);
    const botMsgEl = addBotMsgSkeleton();
    sendBtn.disabled = true;

    const bubble = botMsgEl.querySelector('.bubble');
    const answerEl = document.createElement('div');
    answerEl.className = 'answer';
    bubble.insertBefore(answerEl, bubble.firstChild);

    const ctx = { raw: '', citations: new Map(), answerEl, terminal: false };

    try {
      // POST /api/query/stream → body 即 SSE 流（05 §3）
      const res = await fetch(`${API_BASE}/api/query/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: text, session_id: sessionId }),
      });
      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || `HTTP ${res.status}`);
      }

      for await (const ev of readSSE(res)) {
        onEvent(botMsgEl, ev, ctx);
        if (ctx.terminal) break;
      }
    } catch (e) {
      finishTyping(botMsgEl);
      answerEl.textContent = `请求失败：${e.message || e}`;
    } finally {
      finishTyping(botMsgEl);
      sendBtn.disabled = false;
      scrollToBottom();
    }
  }

  sendBtn.addEventListener('click', onSend);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      onSend();
    }
  });

  btnClear.addEventListener('click', () => {
    if (!confirm('确定要清空当前对话显示吗？')) return;
    const nodes = Array.from(chatEl.querySelectorAll('.msg'));
    for (let i = 1; i < nodes.length; i++) nodes[i].remove();
    // 重开新会话，避免历史影响下一轮
    sessionId = '';
    localStorage.removeItem('ar_session_id');
    renderSession();
    scrollToBottom();
  });

  setTimeout(() => inputEl.focus(), 200);
</script>
</body>
</html>
