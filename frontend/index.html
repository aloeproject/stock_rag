<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>年报 RAG</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --panel: #ffffff;
      --text: #1f2d3d;
      --muted: #7a869a;
      --brand: #1aa7ff;
      --brand2: #5b7cfa;
      --border: #e6e9ef;
      --shadow: 0 10px 30px rgba(31, 45, 61, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(26,167,255,.18), transparent 60%),
                  radial-gradient(1000px 500px at 90% 10%, rgba(91,124,250,.18), transparent 55%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(26,167,255,.10), rgba(91,124,250,.10));
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .title strong { font-size: 18px; display: block; }
    .title span { font-size: 12px; color: var(--muted); }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 24px 22px 28px;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 18px;
      transition: box-shadow .2s, transform .2s;
      background: #fff;
    }
    a.card:hover {
      box-shadow: 0 10px 24px rgba(31,45,61,.12);
      transform: translateY(-2px);
    }
    .card .icon { font-size: 28px; margin-bottom: 10px; }
    .card h3 { margin: 0 0 8px; font-size: 16px; }
    .card p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .hint {
      padding: 0 22px 22px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="logo"></div>
      <div class="title">
        <strong>年报 RAG</strong>
        <span>上市公司年报导入与问答</span>
      </div>
    </div>
    <div class="cards">
      <a class="card" href="import.html">
        <div class="icon">📄</div>
        <h3>年报导入</h3>
        <p>上传 PDF 年报，查看解析、切分、向量入库、指标抽取全过程进度。</p>
      </a>
      <a class="card" href="chat.html">
        <div class="icon">💬</div>
        <h3>年报问答</h3>
        <p>提问即流式回答，实时看到意图识别、证据召回、引用溯源。</p>
      </a>
    </div>
    <div class="hint">API 基址默认同源 <code>http://127.0.0.1:8003</code>，如跨端部署请改页面内 <code>API_BASE</code>。</div>
  </div>
</body>
</html>
