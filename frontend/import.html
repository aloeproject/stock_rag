<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>年报导入</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --brand: #3498db;
      --brand-dark: #2980b9;
      --ok: #2ecc71;
      --warn: #f39c12;
      --err: #e74c3c;
      --border: #e0e0e0;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background-color: var(--panel);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: var(--text);
      text-align: center;
      margin: 0 0 8px;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 24px;
    }
    .sub a { color: var(--brand); text-decoration: none; }
    .upload-area {
      border: 2px dashed var(--brand);
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-bottom: 20px;
    }
    .upload-area:hover { background-color: #ecf6fd; }
    .upload-icon { font-size: 48px; color: var(--brand); margin-bottom: 10px; }
    .file-input { display: none; }
    .file-list { margin-top: 30px; }
    .file-item {
      background-color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .file-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .file-name { font-weight: 600; color: #333; word-break: break-all; }
    .file-size { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .status-badge {
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
      color: white;
      min-width: 80px;
      text-align: center;
      white-space: nowrap;
    }
    .status-uploading { background-color: var(--warn); }
    .status-processing { background-color: var(--brand); }
    .status-completed { background-color: var(--ok); }
    .status-error { background-color: var(--err); }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background-color: #f0f0f0;
      margin-top: 8px;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--warn);
      width: 0%;
      transition: width 0.3s, background-color 0.3s;
    }
    .log-details {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .log-details summary {
      cursor: pointer;
      user-select: none;
      color: #6c7a89;
    }
    .log-list { margin: 6px 0 0 16px; padding: 0; }
    .log-list li { margin: 2px 0; line-height: 1.4; }
    .log-list li.done { color: var(--ok); }
    .log-list li.failed { color: var(--err); }
  </style>
</head>
<body>
<div class="container">
  <h1>📄 年报导入</h1>
  <div class="sub">支持 PDF 年报 · 文件名约定 <code>{股票代码}_{年}_{名称}_{类型}_{发布日期}.pdf</code> · <a href="index.html">返回首页</a></div>

  <div class="upload-area" id="dropZone">
    <div class="upload-icon">☁️</div>
    <p>点击或拖拽 PDF 年报到此处</p>
    <input type="file" id="fileInput" class="file-input" accept=".pdf">
  </div>

  <div id="fileList" class="file-list"></div>
</div>

<script>
  // 默认同源；file:// 打开时指向 FastAPI 端口
  const API_BASE = location.protocol.startsWith('http')
    ? `${location.protocol}//${location.host}`
    : 'http://127.0.0.1:8003';

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.backgroundColor = '#ecf6fd';
  });
  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.style.backgroundColor = '';
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.backgroundColor = '';
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(files) {
    Array.from(files).forEach(uploadFile);
  }

  function updateProgressBar(bar, percentage) {
    bar.style.width = percentage + '%';
    bar.style.backgroundColor = percentage >= 100 ? 'var(--brand)' : 'var(--warn)';
  }

  async function uploadFile(file) {
    const id = 'file-' + Math.random().toString(36).slice(2);
    const html = `
      <div class="file-item" id="${id}">
        <div class="file-info">
          <span class="file-name"></span>
          <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
          <div class="progress-bar-container"><div class="progress-bar"></div></div>
          <details class="log-details">
            <summary>日志（点击展开）</summary>
            <ul class="log-list"></ul>
          </details>
        </div>
        <div class="status-badge status-uploading">上传中...</div>
      </div>
    `;
    fileList.insertAdjacentHTML('afterbegin', html);
    const itemEl = document.getElementById(id);
    itemEl.querySelector('.file-name').textContent = file.name;
    const statusBadge = itemEl.querySelector('.status-badge');
    const progressBar = itemEl.querySelector('.progress-bar');
    const progressContainer = itemEl.querySelector('.progress-bar-container');
    const logListEl = itemEl.querySelector('.log-list');
    const logSummary = itemEl.querySelector('.log-details summary');

    const formData = new FormData();
    formData.append('file', file);  // 字段名与 FastAPI UploadFile 一致

    try {
      progressContainer.style.display = 'block';
      updateProgressBar(progressBar, 15);

      const response = await fetch(`${API_BASE}/api/import/report`, {
        method: 'POST',
        body: formData,
      });
      const result = await response.json();
      // ResponseData 包装：{ code, message, data: { document_id, source_file } }
      if (result.code !== 200) throw new Error(result.message || '上传失败');

      const documentId = result.data.document_id;
      updateProgressBar(progressBar, 35);
      statusBadge.textContent = '处理中...';
      statusBadge.className = 'status-badge status-processing';

      watchProgress(documentId, itemEl);
    } catch (error) {
      statusBadge.textContent = '失败';
      statusBadge.className = 'status-badge status-error';
      appendLog(logListEl, logSummary, error.message, 'failed');
    }
  }

  function appendLog(logListEl, logSummary, text, cls) {
    const li = document.createElement('li');
    li.textContent = text;
    if (cls) li.className = cls;
    logListEl.appendChild(li);
    const done = logListEl.querySelectorAll('li.done').length;
    const failed = logListEl.querySelectorAll('li.failed').length;
    const running = logListEl.querySelectorAll('li.running').length;
    logSummary.textContent = `日志（已完成${done}，失败${failed}，进行中${running}，点击展开）`;
  }

  function markFinished(statusBadge, progressBar, logListEl, logSummary) {
    statusBadge.textContent = '已完成';
    statusBadge.className = 'status-badge status-completed';
    updateProgressBar(progressBar, 100);
    appendLog(logListEl, logSummary, '✅ 导入完成', 'done');
  }

  // GET /api/import/progress/{document_id} → SSE
  // 事件：{"type":"progress","step","status":"running|done|failed"} / {"type":"finished"} / {"type":"error"}
  function watchProgress(documentId, itemEl) {
    const statusBadge = itemEl.querySelector('.status-badge');
    const progressBar = itemEl.querySelector('.progress-bar');
    const logListEl = itemEl.querySelector('.log-list');
    const logSummary = itemEl.querySelector('.log-details summary');

    const es = new EventSource(`${API_BASE}/api/import/progress/${documentId}`);
    let doneCount = 0;
    const TOTAL_STEPS = 8;  // parse/metadata/split/sectionize/embed/table/normalize/commit

    es.onmessage = (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch { return; }

      if (ev.type === 'progress') {
        const status = ev.status || 'running';
        const mark = status === 'done' ? '✅' : status === 'failed' ? '❌' : '⏳';
        const cls = status === 'done' ? 'done' : status === 'failed' ? 'failed' : 'running';
        // 先移除同 step 的旧 running 行，避免重复
        Array.from(logListEl.children).forEach((li) => {
          if (li.textContent.includes(ev.step) && li.className === 'running') li.remove();
        });
        appendLog(logListEl, logSummary, `${mark} ${ev.step}（${status}）`, cls);

        if (status === 'done') doneCount += 1;
        const pct = Math.min(95, 35 + (doneCount / TOTAL_STEPS) * 60);
        updateProgressBar(progressBar, pct);

        // 兜底：后端万一漏发 finished，步骤全过也视作完成，不让前端挂住
        if (doneCount >= TOTAL_STEPS) {
          markFinished(statusBadge, progressBar, logListEl, logSummary);
          es.close();
        }
      } else if (ev.type === 'finished') {
        markFinished(statusBadge, progressBar, logListEl, logSummary);
        es.close();
      } else if (ev.type === 'error') {
        statusBadge.textContent = '失败';
        statusBadge.className = 'status-badge status-error';
        appendLog(logListEl, logSummary, `❌ ${ev.message || '导入失败'}`, 'failed');
        es.close();
      }
    };

    es.onerror = () => {
      // 流正常结束也会触发 onerror；若已终态则忽略
      if (statusBadge.textContent === '已完成' || statusBadge.textContent === '失败') {
        es.close();
        return;
      }
      statusBadge.textContent = '失败';
      statusBadge.className = 'status-badge status-error';
      appendLog(logListEl, logSummary, '❌ SSE 连接中断', 'failed');
      es.close();
    };
  }
</script>
</body>
</html>
